# Phrourax automatic verification — BY HAND only. The every-4-hours runs happen inside the hourly census
# (census.yml → "Checks (when due)"), which cron-job.org keeps on time; GitHub's own schedule was unreliable, and two
# timers could both append to the log at once. Use this to run the checks right now: Actions → verify → Run workflow.
# Reads a few real wallets from the latest census with the site's own readers and compares them with sources Phrourax's
# own path doesn't use (Tydro's AaveProtocolDataProvider; Nado's Clearinghouse.getHealth for every subaccount; Nado's
# official API, which may refuse — then SOURCE UNAVAILABLE, never worked around). Appends to verification-log.json on
# Vercel Blob; the Checks page shows it. Read-only. Same secrets as the census. Nothing here can move funds.

name: verify
run-name: verify · ${{ github.event_name }}

on:
  workflow_dispatch:

concurrency:
  group: verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - run: pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - name: Verify
        run: pnpm verify:auto --store blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          INK_RPC: ${{ secrets.INK_RPC }}
