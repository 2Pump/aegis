# Phrourax Telegram alerts — OFF until the owner turns it on.
# Every job is skipped unless the repository VARIABLE ALERTS_ENABLED is 'true' (Settings → Secrets and variables →
# Actions → Variables). Secrets it needs (Settings → Secrets → Actions):
#   TELEGRAM_BOT_TOKEN  from @BotFather
#   ALERTS_STORE_KEY    32 random bytes, base64 (encrypts the alerts db: chat ids never sit in the clear)
#   BLOB_READ_WRITE_TOKEN, INK_RPC (optional) — the same ones the census uses
# Each run: keeps the bot's webhook pointed at phrourax.com (bot commands are answered there, instantly), fetches the
# linked Pro/Desk accounts from the site, reads every watched wallet once (read-only view calls), sends alerts on
# changes, and reports last-known levels back to the site. TELEGRAM_BOT_TOKEN must ALSO be set in Vercel (same value).
# GitHub's own schedule can lag; cron-job.org can dispatch this workflow like it does the census.

name: alerts
run-name: alerts · ${{ github.event_name }}

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alerts:
    if: ${{ vars.ALERTS_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - run: pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - name: Alerts
        run: pnpm alerts --store blob
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERTS_STORE_KEY: ${{ secrets.ALERTS_STORE_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          CENSUS_BLOB_TOKEN: ${{ vars.CENSUS_STORE == 'private' && secrets.CENSUS_BLOB_TOKEN || '' }}
          INK_RPC: ${{ secrets.INK_RPC }}
      - name: Market depth (Nado order books)
        # its own step: whatever happens here, alerts above have already run
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: pnpm depth --store blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          CENSUS_BLOB_TOKEN: ${{ vars.CENSUS_STORE == 'private' && secrets.CENSUS_BLOB_TOKEN || '' }}
          INK_RPC: ${{ secrets.INK_RPC }}
