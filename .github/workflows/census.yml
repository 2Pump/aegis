# AEGIS census — hourly.
# Finds every wallet that has used Tydro or Nado (from public on-chain events), reads them from the Ink chain,
# classifies them with the same rules as the site, and publishes census.json to Vercel Blob.
# Read-only: the only secret is a storage token for Vercel Blob. Nothing here can move funds.
#
# Setup (once):
#   1. Vercel → Storage → Create → Blob → connect to aegis-web. Copy BLOB_READ_WRITE_TOKEN.
#   2. GitHub repo → Settings → Secrets and variables → Actions → New secret: BLOB_READ_WRITE_TOKEN
#   3. (optional) secret INK_RPC with a private Ink RPC URL (or several, comma-separated). Without it the job rotates
#      over Ink's four public RPCs (docs.inkonchain.com/tools/rpc) and rests any that throttle it.
#   4. Actions tab → "census" → Run workflow (the first run backfills history; it may take 2–3 runs).
#
# The hourly start (docs/CENSUS.md → "Hourly start"):
#   GitHub's own schedule is best-effort — on 2026-09-28/29 it started this workflow every 5–7 hours instead of
#   hourly. So the hour is kept by an outside timer (cron-job.org) that calls GitHub's "run workflow" API with
#   source=timer. GitHub's schedule below stays as a slow backup and skips itself when the census is fresh.
#   Repo variable CENSUS_URL (Settings → Secrets and variables → Actions → Variables) = the public census.json URL,
#   so the freshness check can read the snapshot's age. Without it, every run goes ahead.

name: census
run-name: census · ${{ inputs.source || github.event_name }}${{ inputs.full && ' · full' || '' }}

on:
  schedule:
    - cron: '41 */6 * * *' # backup only — skipped when the timer kept the census fresh
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-read every known wallet (a full sweep also runs automatically every 3 hours)'
        type: boolean
        default: false
      source:
        description: 'Who started this run (the outside timer sends "timer")'
        type: string
        default: manual

concurrency:
  group: census
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    # every run may take long enough to read every wallet in ONE run (coverage needs one block): ~45 min for 65,000
    # wallets. Ordinary hourly runs still finish in ~5 min; only the full sweep (every 3 hours) uses the room, so it measures
    # coverage by itself (no hand-started runs needed). Timer runs that arrive meanwhile wait, then skip as fresh.
    timeout-minutes: 130
    steps:
      # Cheap check before installing anything: skip if the census was published moments ago.
      #  - timer runs skip only if the last publish was < 15 min ago (a duplicate queued behind a long run)
      #  - the backup schedule skips if < 50 min ago (the timer is doing its job)
      #  - runs you start by hand never skip
      - name: Freshness check
        id: fresh
        env:
          CENSUS_URL: ${{ vars.CENSUS_URL }}
          SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.source }}
          FULL: ${{ inputs.full }}
        run: |
          node -e '
            (async () => {
              const src = process.env.SOURCE || "manual";
              const limitMin = src === "timer" ? 15 : src === "schedule" ? 50 : 0;
              const out = (skip, why) => { console.log(why); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `skip=${skip}\n`); };
              if (!limitMin || process.env.FULL === "true") return out(false, `started by ${src} — no freshness check`);
              if (!process.env.CENSUS_URL) return out(false, "repo variable CENSUS_URL not set — running without a freshness check");
              try {
                const r = await fetch(process.env.CENSUS_URL + "?t=" + Date.now(), { cache: "no-store" });
                const j = await r.json();
                const age = (Date.now() - Date.parse(j.generatedAt)) / 60000;
                if (age < limitMin) out(true, `census published ${age.toFixed(0)} min ago (< ${limitMin}) — skipping this ${src} run`);
                else out(false, `census is ${age.toFixed(0)} min old — running`);
              } catch (e) {
                out(false, `could not read the census (${e.message}) — running anyway`);
              }
            })();
          '

      - uses: actions/checkout@v5
        if: steps.fresh.outputs.skip != 'true'

      - uses: actions/setup-node@v5
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: 22
          package-manager-cache: false

      # pnpm at the exact version pinned in package.json ("packageManager"), via Node's corepack
      - run: corepack enable
        if: steps.fresh.outputs.skip != 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      - run: pnpm install --frozen-lockfile
        if: steps.fresh.outputs.skip != 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      - name: Run census
        if: steps.fresh.outputs.skip != 'true'
        run: pnpm census --store blob --budget-min 115 ${{ inputs.full && '--full' || '' }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          INK_RPC: ${{ secrets.INK_RPC }}
